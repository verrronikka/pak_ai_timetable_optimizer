name: CI smoke checks

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff checks
        run: |
          ruff check backend
          ruff format --check backend

  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend API/config tests
        run: |
          python -m pytest backend/tests/test_api.py backend/tests/test_config.py -q

  frontend-smoke:
    name: Frontend static smoke
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http.pid"

      - name: Wait for server and smoke-check frontend
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          required_assets = [
              "/frontend/index.html",
              "/frontend/schedule-actions.js",
              "/frontend/schedule-model.js",
              "/backend/solver_contraints.json",
          ]

          for _ in range(30):
              try:
                  with urllib.request.urlopen(f"{base_url}/frontend/index.html"):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Static server did not start in time")

          for asset in required_assets:
              with urllib.request.urlopen(f"{base_url}{asset}") as response:
                  payload = response.read().decode("utf-8")
                  if asset.endswith("index.html"):
                      assert 'id="solver-constraints-summary"' in payload
                      assert 'id="generate-btn"' in payload
                  if asset.endswith("schedule-actions.js"):
                      assert "loadSolverConstraints" in payload
                      assert "solverConstraintsSummary" in payload
                  if asset.endswith("solver_contraints.json"):
                      constraints = json.loads(payload)
                      assert constraints["solver_limits"]["max_search_steps"]["default"] == 200000
                      assert constraints["meta"]["provisional"] is False
          PY

      - name: Stop static server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/http.pid")" || true
          fi
