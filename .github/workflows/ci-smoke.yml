name: CI smoke checks

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff checks
        run: |
          ruff check backend
          ruff format --check backend

  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend API/config tests
        run: |
          python -m pytest backend/tests/test_api.py backend/tests/test_config.py -q

  backend-performance-regression:
    name: Backend performance regression (report-only)
    runs-on: ubuntu-latest
    needs: backend-tests
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run performance regression tests
        run: |
          python -m pytest backend/tests/test_performance_regression.py -q

      - name: Check performance regression threshold
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("reports/generated/performance_regression_latest.json")
          if not report_path.exists():
              raise SystemExit(f"Performance report not found: {report_path}")

          payload = json.loads(report_path.read_text(encoding="utf-8"))
          elapsed = float(payload.get("elapsed_seconds", 0.0))
          threshold = float(payload.get("threshold_seconds", 0.0))

          if elapsed >= threshold:
              print(
                  f"::error title=Performance regression detected::"
                  f"elapsed={elapsed:.3f}s threshold={threshold:.3f}s"
              )
              raise SystemExit(1)

          print(
              f"Performance regression check passed: "
              f"elapsed={elapsed:.3f}s threshold={threshold:.3f}s"
          )
          PY

      - name: Upload performance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-performance-regression-report
          path: reports/generated/performance_regression_latest.json
          if-no-files-found: warn

  frontend-smoke:
    name: Frontend static smoke
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http.pid"

      - name: Wait for server and smoke-check frontend
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          required_assets = [
              "/frontend/index.html",
              "/frontend/schedule-actions.js",
              "/frontend/schedule-model.js",
              "/backend/solver_contraints.json",
          ]

          for _ in range(30):
              try:
                  with urllib.request.urlopen(f"{base_url}/frontend/index.html"):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Static server did not start in time")

          for asset in required_assets:
              with urllib.request.urlopen(f"{base_url}{asset}") as response:
                  payload = response.read().decode("utf-8")
                  if asset.endswith("index.html"):
                      assert 'id="solver-constraints-summary"' in payload
                      assert 'id="generate-btn"' in payload
                  if asset.endswith("schedule-actions.js"):
                      assert "loadSolverConstraints" in payload
                      assert "solverConstraintsSummary" in payload
                  if asset.endswith("solver_contraints.json"):
                      constraints = json.loads(payload)
                      assert constraints["solver_limits"]["max_search_steps"]["default"] == 200000
                      assert constraints["meta"]["provisional"] is False
          PY

      - name: Stop static server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/http.pid")" || true
          fi

  playwright-ui:
    name: Frontend Playwright UI smoke
    runs-on: ubuntu-latest
    needs: frontend-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps

      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http.pid"

      - name: Run Playwright UI smoke tests
        working-directory: frontend
        run: |
          npx playwright test --config=playwright.config.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn

      - name: Stop static server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/http.pid" ]; then
            kill "$(cat \"$RUNNER_TEMP/http.pid\")" || true
          fi
